name: Import Home Master HD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-home-master.yml'
      - 'assets/home-master.jpg'

permissions:
  contents: write

jobs:
  import:
    if: ${{ !hashFiles('assets/home-master.jpg') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Home Master from Canva
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/home-master.jpg 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F78f85f89-25dd-4a30-ba7d-9cb692e05397/watermark:F/width:190?csig=AAAAAAAAAAAAAAAAAAAAANBXnkyybHb4bv8Zu2NJ-VZK3KaaGs39ajYaQkJecAG8&exp=1789418346&osig=AAAAAAAAAAAAAAAAAAAAAIcHvpzP_bmiknXUgl5_Alw7yUdsrk9-RIuhiIE-owh5&signer=media-rpc&x-canva-quality=thumbnail'
          file assets/home-master.jpg
          identify assets/home-master.jpg || true
      - name: Commit imported asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home-master.jpg
          git commit -m 'feat: add Home Master HD asset' || exit 0
          git push
