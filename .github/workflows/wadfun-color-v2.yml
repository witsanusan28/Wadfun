name: Wadfun Color V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  color-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect color engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="color-engine.js"></script>'
          if tag not in s:
              marker='<script src="pen-engine.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+tag)
              else:
                  s=s.replace('</body>', tag+'</body>')
          # Make the currently selected color unmistakable in both workspaces.
          s=s.replace('<span class="colorMini" id="drawDot"></span></i><span>สี</span>', '<span class="colorMini selectedColorIndicator" id="drawDot"></span></i><span>สีที่เลือก</span>')
          s=s.replace('<span class="colorMini" id="colorDot"></span></i><span>สี</span>', '<span class="colorMini selectedColorIndicator" id="colorDot"></span></i><span>สีที่เลือก</span>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add all-device responsive layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* WADFUN RESPONSIVE V2 */'
          if marker not in s:
              css='''\n<style id="wadfun-responsive-v2">\n/* WADFUN RESPONSIVE V2 */\nhtml,body{width:100%;min-height:100%;overflow-x:hidden}\n.app{width:100%;max-width:1280px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}\n/* Drawing/coloring are true edge-to-edge workspaces on every device. */\nbody:has(#draw.active) .top,body:has(#color.active) .top{display:none}\nbody:has(#draw.active) .app,body:has(#color.active) .app{max-width:none;padding:0}\n#draw.active,#color.active{width:100%;height:100dvh;min-height:100vh;overflow:hidden}\n#draw.active .drawPage,#color.active .drawPage{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;padding:clamp(4px,1vw,10px);border-radius:clamp(12px,2vw,28px)}\n#draw.active .toolbar,#color.active .toolbar{width:100%;max-width:100%;flex:0 0 auto;min-height:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;position:relative;top:0}\n#draw.active .canvasArea,#color.active .canvasArea{width:100%;max-width:100%;flex:1 1 auto;height:auto;min-height:0;margin-top:clamp(4px,1vw,9px);overflow:hidden}\n#draw.active .canvasViewport,#color.active .canvasViewport{width:100%;height:100%;min-width:0;min-height:0}\n#draw.active .canvas,#color.active .canvas{max-width:100%;max-height:100%;touch-action:none}\n/* Make the selected color visible even when the palette is closed. */\n.selectedColorIndicator{display:inline-block!important;width:38px!important;height:38px!important;border-radius:50%!important;border:3px solid #fff!important;box-shadow:0 0 0 2px #9fc4d5,0 3px 8px #0002!important}\n@supports not (height:100dvh){#draw.active,#color.active{height:100vh}}\n@media(max-width:950px){.app{padding:4px}.drawPage{width:100%}.canvasArea{width:100%}.colorPopup,.penPopup{max-width:calc(100vw - 12px)}}\n@media(max-width:650px){.top{padding-bottom:5px}.logo{font-size:clamp(22px,7vw,30px)}.roundBtn{padding:7px 9px}.toolbar{max-width:100vw}.tb{min-width:clamp(48px,13vw,58px);height:clamp(48px,13vw,58px)}.sizeBox{min-width:clamp(135px,42vw,190px)}.sizeBox input{width:clamp(55px,18vw,100px)}.colorPopup{width:min(340px,calc(100vw - 12px));right:6px}.penPopup{width:min(320px,calc(100vw - 12px));left:6px}}\n@media(orientation:landscape) and (max-height:600px){#draw.active .drawPage,#color.active .drawPage{padding:3px}.toolbar{padding:3px}.tb{height:46px;min-width:46px}.canvasArea{margin-top:3px}}\n</style>\n'''
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Wadfun Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'Improve selected color and true fullscreen workspace'
            git push
          fi
