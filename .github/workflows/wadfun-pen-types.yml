name: Wadfun Pen Types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pen-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect pen engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="pen-engine.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
              print('connected pen-engine.js')
          else:
              print('already connected')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Connect distinct pen engine"; git push; fi
