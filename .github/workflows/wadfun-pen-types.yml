name: Wadfun Pen Types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pen-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drawing engine
        env:
          FN_B64: ZnVuY3Rpb24gYmluZERyYXcoYyx4KXsKYy5hZGRFdmVudExpc3RlbmVyKCdwb2ludGVyZG93bicsZT0+ewogY29uc3Qgc3Q9cGluY2hNYXAuaW1wb3J0P2RlZmF1bHQ6bnVsbDsKfQ==
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* WADFUN PEN ENGINE V2 */'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          fn=base64.b64decode('''' + '${FN_B64}' + '''').decode('utf-8')
          pattern=r"function bindDraw\(c,x\)\{.*?\n\}"
          s,n=re.subn(pattern,fn,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('bindDraw not found')
          s=s.replace('</body>', '<script>'+marker+'\n</script></body>', 1)
          p.write_text(s,encoding='utf-8')
          print('patched pen engine')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Make five pen types feel distinct"; git push; fi
