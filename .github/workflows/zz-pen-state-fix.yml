name: Wadfun Pen State Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: bind pen state label') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch pen state bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('color-picker-reset-v2.js')
          s=p.read_text()
          marker='/* WADFUN PEN STATE LABEL BRIDGE V3 */'
          if marker not in s:
              s += r'''
/* WADFUN PEN STATE LABEL BRIDGE V3 */
(function(){
'use strict';
if(window.__wadfunPenStateLabelBridgeV3)return;
window.__wadfunPenStateLabelBridgeV3=true;
const labels={pencil:'ดินสอ',crayon:'สีเทียน',brush:'พู่กัน',marker:'เมจิก',sparkle:'ประกาย'};
const valid=id=>Object.prototype.hasOwnProperty.call(labels,id);
function paint(id){
  if(!valid(id))return;
  window.__wadfunSelectedPen=id;
  const b=document.getElementById('penBtn');
  if(b){const spans=b.querySelectorAll('span');if(spans.length)spans[spans.length-1].textContent=labels[id];b.setAttribute('aria-label',labels[id]);}
  window.__wadfunRenderPenIconV5?.();
}
function wrap(){
  const fn=window.choosePen;
  if(typeof fn!=='function'||fn.__wadfunPenStateLabelWrappedV3)return;
  const w=function(id){const r=fn.apply(this,arguments);if(valid(id)){try{localStorage.setItem('wadfun.drawMode.v3',id)}catch(e){}paint(id)}return r};
  w.__wadfunPenStateLabelWrappedV3=true;
  window.choosePen=w;
}
function boot(){
  if(!window.choosePen){setTimeout(boot,100);return}
  if(!window.choosePen.__wadfunPenStateLabelWrappedV3)wrap();
  let saved='';try{saved=localStorage.getItem('wadfun.drawMode.v3')||''}catch(e){}
  if(valid(saved)){try{window.choosePen(saved)}catch(e){paint(saved)}}
  else {const item=document.querySelector('#draw .penItem.on');const id=item&&Object.keys(labels).find(x=>item.classList.contains(x));if(valid(id))paint(id)}
}
boot();
window.addEventListener('wadfun:draw-ready',boot);
})();
'''
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/zz-pen-state-fix.yml debug/pen-label-direct-fix.trigger 2>/dev/null || true
          git add color-picker-reset-v2.js
          git commit -m 'fix: bind pen state label' || true
          git push
