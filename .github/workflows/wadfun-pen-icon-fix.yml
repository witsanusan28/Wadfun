name: Wadfun Pen Icon Fix
on:
  push:
    paths:
      - 'debug/pen-icon-fix.trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch pen icon sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('color-picker-reset-v2.js')
          s=p.read_text()
          anchor="render();\ndocument.addEventListener('click',e=>{const item=e.target?.closest?.('#draw .penItem');if(!item)return;"
          repl="render();\nwindow.__wadfunRenderPenIconV5=render;\ndocument.addEventListener('click',e=>{const item=e.target?.closest?.('#draw .penItem');if(!item)return;"
          if anchor not in s:
              raise SystemExit('renderer click anchor not found')
          s=s.replace(anchor,repl,1)
          if 'WADFUN PEN ICON POST-CLICK SYNC V1' not in s:
              s += "\n/* WADFUN PEN ICON POST-CLICK SYNC V1 */\n(function(){'use strict';document.addEventListener('click',e=>{if(!e.target?.closest?.('#draw .penItem'))return;setTimeout(()=>window.__wadfunRenderPenIconV5?.(),0);setTimeout(()=>window.__wadfunRenderPenIconV5?.(),120);setTimeout(()=>window.__wadfunRenderPenIconV5?.(),300)},false)})();\n"
          p.write_text(s)
          PY
          rm -f debug/pen-icon-fix.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add color-picker-reset-v2.js debug/pen-icon-fix.trigger .github/workflows/wadfun-pen-icon-fix.yml
          git commit -m 'fix: sync drawing pen icon after selection'
          git push origin main
