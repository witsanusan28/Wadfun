name: Wadfun Color Library Test
on:
  push:
    branches: [main]
jobs:
  color-library-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@24
      - name: Check JavaScript syntax
        run: |
          node --check color-library.js
          node --check color-library-fix.js
          node --check color-picker-reset-v2.js
          node --check color-picker-controller.js
          node --check color-engine.js
          node --check color-engine-v24.js
          node --check color-history.js
          node --check color-line-lock.js
          node --check tests/color-library-navigation.test.js
          node --check tests/color-workspace-fix.test.js
          node --check tests/color-history-buttons.test.js
          node --check tests/color-start-new.test.js
      - name: Check Color Engine V27 contract
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('color-engine.js','utf8');
          for(const token of ['Color Engine V27','paint','ink','line','mask','wadfunColorResetV25','wadfunColorFreshReset','undoColor','redoColor','destination-out','pc.save()','ic.save()','fill(x,y)','wireButtons']) if(!s.includes(token)) throw new Error(`missing V27 contract: ${token}`);
          NODE
      - name: Check workspace fix V7 contract
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('color-picker-reset-v2.js','utf8');
          for(const token of ['Workspace Fix V7','flex-wrap','overflow-x:hidden','exportImage','__wadfunFinishFixV7','finishCanvas','startNewSafe','toolState','restoreToolState','current imageId']) if(!s.includes(token)) throw new Error(`missing workspace V7 contract: ${token}`);
          NODE
      - name: Check Color History V6 contract
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('color-history.js','utf8');
          for(const token of ['Color History V6','engineUndo','engineRedo','colorUndoBtn','colorRedoBtn','insertAdjacentElement','wadfunColorHistoryState']) if(!s.includes(token)) throw new Error(`missing history contract: ${token}`);
          NODE
      - name: Check Color Library V12 contract
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('color-library.js','utf8');
          for(const key of ['animals','food','vehicles','nature','fantasy']) if(!s.includes(`${key}:`)) throw new Error(`missing category: ${key}`);
          for(const token of ['wadfunColorLibraryData','renderCategories','renderPictures','colorScreen','renderSelected','wadfunChangePicture','wadfunColorLibraryState','wadfunColorFreshReset','function startNew()','function addChange()','document.querySelector(\'#color .toolbar\')']) if(!s.includes(token)) throw new Error(`missing library contract: ${token}`);
          if(!s.includes('__wadfunColorLibraryV12')) throw new Error('wrong library owner version');
          if(!s.includes('#categoriesGrid .cat')||!s.includes('#pickerGrid .template')) throw new Error('picker routes missing');
          if(!s.includes('stopImmediatePropagation')) throw new Error('click isolation missing');
          NODE
      - name: Run real DOM Change Picture navigation test
        run: node tests/color-library-navigation.test.js
      - name: Run Color Undo/Redo button test
        run: node tests/color-history-buttons.test.js
      - name: Run Start New state isolation test
        run: node tests/color-start-new.test.js
      - name: Run workspace finish and mobile toolbar test
        run: node tests/color-workspace-fix.test.js
      - name: Verify HTML picker and history targets exist
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const id of ['categories','categoriesGrid','picker','pickerGrid','colorCanvas','colorViewport']) if(!s.includes(`id=\"${id}\"`)) throw new Error(`missing HTML target: ${id}`);
          if(!s.includes('color-library.js')||!s.includes('color-engine.js')||!s.includes('color-history.js')) throw new Error('required color scripts are not loaded');
          NODE
