name: Wadfun Color Library Test

on:
  push:
    branches: [main]

jobs:
  color-library-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install DOM test dependency
        run: npm install --no-save jsdom@24

      - name: Check JavaScript syntax
        run: |
          node --check color-library.js
          node --check color-library-fix.js
          node --check color-picker-reset-v2.js
          node --check color-picker-controller.js
          node --check color-engine.js
          node --check color-engine-v24.js
          node --check color-line-lock.js
          node --check tests/color-library-navigation.test.js
          node --check tests/color-workspace-fix.test.js

      - name: Check Color Engine V25 contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('color-engine.js','utf8');
          for (const token of ['Color Engine V25','paint','ink','line','mask','wadfunColorResetV25','undoColor','destination-out','fill(x,y)']) {
            if (!s.includes(token)) throw new Error(`missing V25 contract: ${token}`);
          }
          console.log('Color Engine V25 contract OK');
          NODE

      - name: Check workspace fix contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('color-picker-reset-v2.js','utf8');
          for (const token of ['Workspace Fix V5','flex-wrap','overflow-x:hidden','exportImage','__wadfunFinishFixV5','finishCanvas']) {
            if (!s.includes(token)) throw new Error(`missing workspace fix contract: ${token}`);
          }
          console.log('Workspace Fix V5 contract OK');
          NODE

      - name: Check Color Library V8 contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('color-library.js','utf8');
          for (const key of ['animals','food','vehicles','nature','fantasy']) {
            if (!s.includes(`${key}:`)) throw new Error(`missing category: ${key}`);
          }
          for (const token of ['wadfunColorLibraryData','renderCategories','renderPictures','hideAllScreens','showOnly','showCategories','showPicker','choosePicture','directColorScreen','renderSelected','wadfunChangePicture','wadfunColorLibraryState']) {
            if (!s.includes(token)) throw new Error(`missing contract: ${token}`);
          }
          if (!s.includes('__wadfunColorLibraryV8')) throw new Error('wrong library owner version');
          if (!s.includes('#categoriesGrid .cat')) throw new Error('category click route missing');
          if (!s.includes('#pickerGrid .template')) throw new Error('picture click route missing');
          if (!s.includes('stopImmediatePropagation')) throw new Error('click isolation missing');
          if (!s.includes("changePicture(){showPicker()}")) throw new Error('persistent picker return missing');
          console.log('Color Library V8 contract OK');
          NODE

      - name: Run real DOM Change Picture navigation test
        run: node tests/color-library-navigation.test.js

      - name: Run workspace finish and mobile toolbar test
        run: node tests/color-workspace-fix.test.js

      - name: Verify HTML picker targets exist
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for (const id of ['categories','categoriesGrid','picker','pickerGrid','colorCanvas','colorViewport']) {
            if (!s.includes(`id=\"${id}\"`)) throw new Error(`missing HTML target: ${id}`);
          }
          if (!s.includes('color-library.js')) throw new Error('color-library.js is not loaded by index.html');
          if (!s.includes('color-engine.js')) throw new Error('color-engine.js is not loaded by index.html');
          console.log('HTML picker targets OK');
          NODE
