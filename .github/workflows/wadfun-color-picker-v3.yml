name: Wadfun Color Picker V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  color-picker-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch pen button single owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<button class="tb on" id="penBtn" onclick="togglePenPopup()"><i>✏️</i><span>ปากกา</span></button>'
          new='<button class="tb on" id="penBtn" onclick="togglePenPopup()"><i id="penBtnIcon" aria-hidden="true"></i><span id="penBtnLabel"></span></button>'
          if old in s:
              s=s.replace(old,new,1)

          old_fn="""function choosePen(id){
  drawMode=id;
  document.getElementById('penBtn').classList.add('on');
  document.getElementById('eraserBtn').classList.remove('on');
  document.getElementById('sizeLabel').textContent='ขนาดเส้น';
  const el=document.getElementById('drawSize');
  el.min=2;
  el.max=40;
  el.value=drawSize;
  document.getElementById('drawSizeValue').textContent=drawSize+' px';
  renderPens();
  closePopups()
}"""
          new_fn="""function choosePen(id){
  const penLabels={pencil:'ดินสอ',crayon:'สีเทียน',brush:'พู่กัน',marker:'เมจิก',sparkle:'ประกาย'};
  if(!Object.prototype.hasOwnProperty.call(penLabels,id))return;
  drawMode=id;
  window.__wadfunSelectedPen=id;

  const btn=document.getElementById('penBtn');
  if(btn){
    btn.classList.add('on');
    const label=document.getElementById('penBtnLabel')||btn.querySelector('span');
    if(label)label.textContent=penLabels[id];
    btn.setAttribute('aria-label',penLabels[id]);
  }

  document.getElementById('eraserBtn').classList.remove('on');
  document.getElementById('sizeLabel').textContent='ขนาดเส้น';
  const el=document.getElementById('drawSize');
  el.min=2;
  el.max=40;
  el.value=drawSize;
  document.getElementById('drawSizeValue').textContent=drawSize+' px';
  renderPens();
  window.__wadfunRenderPenIconV5?.();
  closePopups()
}"""
          if old_fn in s:
              s=s.replace(old_fn,new_fn,1)

          p.write_text(s,encoding='utf-8')

          q=Path('color-picker-reset-v2.js')
          s=q.read_text(encoding='utf-8')
          for marker in [
              '/* WADFUN PEN ICON POST-CLICK SYNC V2 */',
              '/* WADFUN PEN ICON DIRECT STATE V2 */',
              '/* WADFUN PEN LABEL SYNC V1 */',
              '/* WADFUN PEN STATE LABEL BRIDGE V3 */'
          ]:
              while marker in s:
                  start=s.index(marker)
                  end=s.find('})();',start)
                  if end<0: break
                  s=s[:start]+s[end+4:]
          q.write_text(s,encoding='utf-8')
          PY
      - name: Verify pen single owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('index.html').read_text(encoding='utf-8')
          b=Path('color-picker-reset-v2.js').read_text(encoding='utf-8')
          assert '<span>ปากกา</span>' not in a
          assert 'function choosePen(id){' in a
          assert 'window.__wadfunSelectedPen=id;' in a
          assert "penLabels[id]" in a
          assert 'window.__wadfunRenderPenIconV5?.();' in a
          for marker in ['WADFUN PEN ICON POST-CLICK SYNC V2','WADFUN PEN ICON DIRECT STATE V2','WADFUN PEN LABEL SYNC V1','WADFUN PEN STATE LABEL BRIDGE V3']:
              assert marker not in b, marker
          print('Pen single-owner verification: PASS')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Wadfun Bot'
          git config user.email 'actions@github.com'
          git add index.html color-picker-reset-v2.js
          if git diff --cached --quiet; then echo 'No patch needed'; else git commit -m 'fix: make choosePen the single pen button owner'; git push; fi
