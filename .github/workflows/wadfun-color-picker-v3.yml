name: Wadfun Color Picker V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  color-picker-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect picker engine and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="color-picker-v3.js"></script>'
          if tag not in s:
              marker='<script src="color-engine.js"></script>'
              if marker in s: s=s.replace(marker,marker+tag)
              else: s=s.replace('</body>',tag+'</body>')
          marker='/* WADFUN COLOR PICKER V3 */'
          if marker not in s:
              css='''\n<style id="wadfun-color-picker-v3">\n/* WADFUN COLOR PICKER V3 */\n.pickerSelectedPreview{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding:8px 10px;border-radius:14px;background:#f1f9ff;border:2px solid #d6edf7;font-weight:900}.pickerPreviewDot{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #7fa7b8,0 2px 5px #0002;flex:none}.pickerPreviewText{font-size:12px}.pickerPreviewHex{margin-left:auto;font-size:12px;letter-spacing:.4px}.pickerMarker{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 0 0 3px #17344b,0 2px 6px #0005;pointer-events:none;z-index:5}.pickerMarker:after{content:'';position:absolute;inset:5px;border:2px solid #fff;border-radius:50%}.colorPopup .hue,.colorPopup .shade{position:relative}.pickerSliderMarker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 0 0 2px #17344b,0 2px 5px #0004;pointer-events:none;z-index:3}.hueMarker{background:#e53935}.shadeMarker{background:#777}.colorPopup .hue{position:relative}.colorPopup .hueMarker{top:50%;}.colorPopup .shade .shadeMarker{top:50%;}\n</style>\n'''
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Patch pen toolbar state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('color-picker-reset-v2.js')
          s=p.read_text(encoding='utf-8')
          marker='/* WADFUN PEN STATE LABEL BRIDGE V3 */'
          if marker not in s:
              s += r'''
/* WADFUN PEN STATE LABEL BRIDGE V3 */
(function(){
'use strict';
if(window.__wadfunPenStateLabelBridgeV3)return;
window.__wadfunPenStateLabelBridgeV3=true;
const labels={pencil:'ดินสอ',crayon:'สีเทียน',brush:'พู่กัน',marker:'เมจิก',sparkle:'ประกาย'};
const valid=id=>Object.prototype.hasOwnProperty.call(labels,id);
function paint(id){
  if(!valid(id))return;
  window.__wadfunSelectedPen=id;
  const b=document.getElementById('penBtn');
  if(b){const spans=b.querySelectorAll('span');if(spans.length)spans[spans.length-1].textContent=labels[id];b.setAttribute('aria-label',labels[id]);}
  window.__wadfunRenderPenIconV5?.();
}
function wrap(){
  const fn=window.choosePen;
  if(typeof fn!=='function')return false;
  if(fn.__wadfunPenStateLabelWrappedV3)return true;
  const w=function(id){const r=fn.apply(this,arguments);if(valid(id)){try{localStorage.setItem('wadfun.drawMode.v3',id)}catch(e){}paint(id)}return r};
  w.__wadfunPenStateLabelWrappedV3=true;
  window.choosePen=w;
  return true;
}
function boot(){
  if(!window.choosePen)return false;
  wrap();
  let saved='';try{saved=localStorage.getItem('wadfun.drawMode.v3')||''}catch(e){}
  if(valid(saved)){try{window.choosePen(saved)}catch(e){paint(saved)}}
  else {const item=document.querySelector('#draw .penItem.on');const id=item&&Object.keys(labels).find(x=>item.classList.contains(x));if(valid(id))paint(id)}
  return true;
}
boot();
[50,150,300,600,1000,1600].forEach(t=>setTimeout(boot,t));
window.addEventListener('wadfun:draw-ready',boot);
})();
'''
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Wadfun Bot'
          git config user.email 'actions@github.com'
          git add index.html color-picker-reset-v2.js
          if git diff --cached --quiet; then echo 'No patch needed'; else git commit -m 'fix: bind pen state label'; git push; fi
